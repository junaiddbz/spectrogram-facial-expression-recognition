name: CI — Lint, Test & Type Check

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Code Quality (black + flake8 + isort)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install linting tools
        run: pip install black==24.2.0 flake8==7.0.0 isort==5.13.2

      - name: Check formatting (black)
        run: black --check --diff src/ app/ tests/

      - name: Check imports (isort)
        run: isort --check-only --diff src/ app/ tests/

      - name: Lint (flake8)
        run: flake8 src/ app/ tests/ --max-line-length=100 --ignore=E203,W503

  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}

      - name: Install CPU-only dependencies
        run: |
          pip install torch==2.2.0+cpu torchvision==0.17.0+cpu \
            --index-url https://download.pytorch.org/whl/cpu
          pip install scipy==1.12.0 numpy==1.26.4 opencv-python-headless==4.9.0.80 \
            matplotlib==3.8.2 scikit-learn==1.4.0 Pillow==10.2.0
          pip install pytest==8.0.2 pytest-cov==4.1.0

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short \
            --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
